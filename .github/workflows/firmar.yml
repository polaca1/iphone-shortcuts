name: Firmar atajo iPhone

on:
  workflow_dispatch:
  push:
    paths:
      - 'Vercel_IA_sin_firmar.shortcut'
      - '.github/workflows/firmar.yml'

permissions:
  contents: read

jobs:
  firmar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar atajo sin firmar
        shell: bash
        run: |
          set -euo pipefail
          test -s Vercel_IA_sin_firmar.shortcut
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path('Vercel_IA_sin_firmar.shortcut')
          data = plistlib.loads(p.read_bytes())
          assert isinstance(data.get('WFWorkflowActions'), list)
          assert data['WFWorkflowActions'], 'Atajo sin acciones'
          print(f"Atajo verificado: {len(data['WFWorkflowActions'])} acciones, {p.stat().st_size} bytes")
          PY

      - name: Firmar mediante Shortcuty (servicio externo)
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl --show-error --silent \
            --connect-timeout 15 --max-time 120 \
            -w '%{http_code}' \
            -F 'file=@Vercel_IA_sin_firmar.shortcut' \
            'https://sign.shortcuty.app/api/v1/sign' \
            -o Vercel_IA_firmado.shortcut)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Servicio de firma respondio HTTP $STATUS"
            head -c 600 Vercel_IA_firmado.shortcut || true
            echo ""
            exit 1
          fi

      - name: Comprobar firma
        shell: bash
        run: |
          set -euo pipefail
          test -s Vercel_IA_firmado.shortcut
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Vercel_IA_firmado.shortcut')
          data = p.read_bytes()
          if not data.startswith(b'AEA1'):
              print('No se recibio un archivo AEA1 firmado. Respuesta inicial:', repr(data[:300]))
              raise SystemExit(1)
          print('Archivo firmado recibido: ', len(data), 'bytes')
          PY
          sha256sum Vercel_IA_firmado.shortcut

      - name: Descargar atajo firmado
        uses: actions/upload-artifact@v4
        with:
          name: Vercel-IA-firmado
          path: Vercel_IA_firmado.shortcut
          if-no-files-found: error
          retention-days: 7
